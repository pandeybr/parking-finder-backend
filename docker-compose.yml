services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: parking-finder-postgres
    environment:
      POSTGRES_DB: parkingdb
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
    ports:
      - "5432:5432"
    volumes:
      - parking_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parkingdb"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  parking_postgres_data:
